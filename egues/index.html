<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ciudad Deportiva Artica — Crintech TV</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    .slideshow {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: none;
      will-change: opacity;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .slide img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .slide.active {
      z-index: 2;
    }

    .slide.prev {
      z-index: 1;
    }

    /* Fade simple */
    .slide.active {
      animation: fadeIn 1s ease forwards;
    }
    .slide.prev {
      animation: fadeOut 1s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    /* ── Placeholder when no images ── */
    .no-images {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      color: #555;
      font-size: 2rem;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div class="slideshow" id="slideshow"></div>

  <script>
    const INTERVAL = 8000; // ms between slides
    const REFRESH = 60000; // ms entre checks de imágenes nuevas (1 min)
    let images = [];
    let current = 0;
    let prevSlide = null;
    let slideTimer = null;

    async function fetchImages() {
      try {
        const res = await fetch('images.json?' + Date.now());
        return await res.json();
      } catch {
        return [];
      }
    }

    async function init() {
      images = await fetchImages();
      const container = document.getElementById('slideshow');

      if (images.length === 0) {
        container.innerHTML = '<div class="no-images">Sin imágenes — sube archivos a /artica/images/</div>';
        return;
      }

      images.forEach(src => { const img = new Image(); img.src = 'images/' + src; });

      const firstSlide = createSlide(images[0]);
      container.appendChild(firstSlide);
      firstSlide.classList.add('active');
      firstSlide.style.opacity = '1';

      startSlideshow();
    }

    function startSlideshow() {
      if (slideTimer) clearInterval(slideTimer);
      if (images.length <= 1) return;

      slideTimer = setInterval(() => {
        const container = document.getElementById('slideshow');
        const nextIdx = (current + 1) % images.length;

        if (prevSlide) prevSlide.remove();

        const currentSlide = container.querySelector('.slide.active');
        currentSlide.classList.remove('active');
        currentSlide.classList.add('prev');
        prevSlide = currentSlide;

        const newSlide = createSlide(images[nextIdx]);
        container.appendChild(newSlide);
        void newSlide.offsetWidth;
        newSlide.classList.add('active');

        current = nextIdx;
      }, INTERVAL);
    }

    // Auto-refresh: comprueba imágenes nuevas cada minuto
    setInterval(async () => {
      const newImages = await fetchImages();
      const changed = JSON.stringify(newImages) !== JSON.stringify(images);
      if (!changed || newImages.length === 0) return;

      // Preload nuevas
      newImages.forEach(src => { const img = new Image(); img.src = 'images/' + src; });

      images = newImages;
      current = current % images.length;
      startSlideshow();
    }, REFRESH);

    function createSlide(src) {
      const div = document.createElement('div');
      div.className = 'slide';
      const img = document.createElement('img');
      img.src = 'images/' + src;
      img.alt = '';
      div.appendChild(img);
      return div;
    }

    // Hard reload cada 28 min como fallback anti-sleep
    setTimeout(() => location.reload(), 28 * 60 * 1000);

    // Wake Lock: impide que la pantalla se apague
    async function requestWakeLock() {
      try {
        await navigator.wakeLock.request('screen');
      } catch {}
    }
    requestWakeLock();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });

    init();
  </script>
</body>
</html>
